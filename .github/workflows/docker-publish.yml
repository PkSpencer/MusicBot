name: Build and Push to Docker Hub

# Controls when the action will run
on:
  push:
    branches: [ "main" ] # Triggers the workflow on push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull down the repository code
    - name: Check out the repo
      uses: actions/checkout@v4

    # Step 2: Log into Docker Hub using the secrets created earlier
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 3: Build the Dockerfile and push it to Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Replace 'your-dockerhub-repo-name' with your actual target Docker Hub repository name
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/musicbot:latest

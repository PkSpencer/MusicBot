name: Build and Push with Buildpacks

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Corrected: Install the Pack CLI using a valid up-to-date version
      - name: Set up Pack CLI
        uses: buildpacks/github-actions/setup-pack@v6.1.1

      # 3. Log in to Docker Hub so you can publish the finished image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Run the buildpack command using the Pack CLI directly
      - name: Build and push image with Buildpacks
        run: |
          pack build ${{ secrets.DOCKERHUB_USERNAME }}/musicbot:latest \
            --builder gcr.io/buildpacks/builder:v1 \
            --publish

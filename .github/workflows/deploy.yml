 steps:
      # 1. Pulls your repository files into the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up Docker Buildx virtual builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Builds the image using the newly created Dockerfile
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true # Change to true if you are pushing to Docker Hub/GHCR